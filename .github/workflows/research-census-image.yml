name: Identify historical census image
on:
  push:
    paths:
      - '.github/workflows/research-census-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Locate ED 61-202 in NARA open data
        run: |
          python3 - <<'PY'
          import urllib.request,json
          url='https://nara-1950-census.s3.us-east-2.amazonaws.com/metadata/json/ca.json'
          with urllib.request.urlopen(url,timeout=90) as response:
              data=json.load(response)
          print('Root keys:',list(data)[:10])
          matches=[]
          def walk(v,p='root'):
              if isinstance(v,dict):
                  ed=str(v.get('ed',''))
                  if ed in ('61-202','61–202'):
                      matches.append((p,v))
                  for k,x in v.items(): walk(x,p+'/'+str(k))
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,p+'/'+str(i))
          walk(data)
          print('Matches for 61-202:',len(matches))
          for p,r in matches:
              print('Match path:',p)
              print('Record:',json.dumps(r,ensure_ascii=True)[:18000])
          if not matches:
              raise SystemExit('Enumeration district not found')
          PY
